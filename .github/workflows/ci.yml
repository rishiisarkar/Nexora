name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    env:
      COMPACT_BACKEND: wasm
      COMPACT_VERSION: 0.31.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test smart contract
        run: npm run test --workspace=contracts

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace=app

      - name: Build frontend
        run: npm run build --workspace=app

  level-6-verification:
    name: Level 6 Submission Evidence & Contract Verification
    runs-on: ubuntu-latest
    needs: [contract-tests, frontend-build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Level 6 evidence, contract deployment, and on-chain state
        run: node scripts/verify-submission.mjs

  deployment-ready:
    name: Deployment ready
    runs-on: ubuntu-latest
    needs:
      - contract-tests
      - frontend-build
      - level-6-verification
    steps:
      - name: Mark deployment readiness
        run: echo "Contract tests, frontend build, and Level 6 evidence verification passed."
